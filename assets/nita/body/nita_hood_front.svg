  <circle cx="104" cy="30" r="15" fill="#e04646" stroke="#1e1e2c" stroke-width="3.5"/>
  <!-- Main Hood Silhouette -->
  <path d="M66,4 C34,4 12,32 12,72 C12,104 36,124 66,124 C96,124 120,104 120,72 C120,32 98,4 66,4 Z"
