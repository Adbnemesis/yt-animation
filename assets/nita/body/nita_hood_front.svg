  <ellipse cx="66" cy="46" rx="5.5" ry="4.5" fill="#0e1730"/>
  <line x1="46" y1="42" x2="56" y2="52" stroke="#1e1e2c" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="56" y1="42" x2="46" y2="52" stroke="#1e1e2c" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="76" y1="42" x2="86" y2="52" stroke="#1e1e2c" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="86" y1="42" x2="76" y2="52" stroke="#1e1e2c" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Face Opening (dark red interior recess) -->
  <ellipse cx="66" cy="86" rx="37" ry="33" fill="#6e2323" stroke="#1e1e2c" stroke-width="3.2"/>
