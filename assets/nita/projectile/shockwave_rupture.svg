<svg xmlns="http://www.w3.org/2000/svg" width="88" height="88" viewBox="0 0 88 88">
  <!-- Nita Canonical Ground-Piercing Shockwave Rupture (Brawl Stars Style) -->
  <defs>
    <filter id="shockwave-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.0" flood-color="#00f0ff" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- 1. Ambient Energy Blast Aura -->
  <ellipse cx="44" cy="46" rx="38" ry="34" fill="#00f0ff" opacity="0.18"/>
  <ellipse cx="48" cy="44" rx="28" ry="24" fill="#67e8f9" opacity="0.22"/>

  <!-- 2. Ground Fissure & Piercing Cracks (Seated at Ground Plane y=80) -->
  <!-- Dark jagged fracture line piercing into earth -->
  <path d="M 4,80 L 14,84 L 26,79 L 38,85 L 50,80 L 62,86 L 74,80 L 84,83" 
        fill="none" stroke="#1e1e2c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 18,80 L 22,86 L 25,83" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 42,80 L 46,87 L 52,82" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 64,80 L 68,86 L 72,81" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Kicked-Up Earth Debris & Stones -->
  <polygon points="12,77 16,73 19,76 17,80 13,80" fill="#7c3a34" stroke="#1e1e2c" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="34,76 39,71 43,74 41,79 36,79" fill="#57302b" stroke="#1e1e2c" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="68,76 73,72 77,75 75,80 70,80" fill="#7c3a34" stroke="#1e1e2c" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="28" cy="74" r="2.2" fill="#1e1e2c"/>
  <circle cx="58" cy="73" r="2.5" fill="#1e1e2c"/>
  <circle cx="80" cy="76" r="1.8" fill="#1e1e2c"/>

