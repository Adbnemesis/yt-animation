           L 10,64
           L 18,52
           L 12,38
           L 24,24
           L 38,14
           L 48,6
           L 52,18
           L 62,12
           L 66,24
           L 78,22
           L 84,38
           L 72,46
           L 80,56
           L 68,66
           L 74,76
