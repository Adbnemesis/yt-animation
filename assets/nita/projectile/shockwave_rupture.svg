  <polygon points="86,48 90,45 88,51" fill="#67e8f9"/>
  <polygon points="54,6 57,3 59,7 56,9" fill="#ffffff"/>
  <circle cx="74" cy="20" r="1.8" fill="#ffffff"/>
  <circle cx="85" cy="40" r="2.2" fill="#ffffff"/>
  <circle cx="78" cy="62" r="1.8" fill="#ffffff"/>
  <circle cx="48" cy="11" r="2.0" fill="#ffffff"/>
  <circle cx="36" cy="16" r="1.5" fill="#e0f7fa"/>
</svg>
