    <text x="50" y="775">✓ Signature Face: Dark chocolate war paint mask, fierce slanted eyes, sassy smirk</text>
    <text x="470" y="755">✓ Authentic Outfit: Emerald tunic, cyan paw medallion, wrap skirt</text>
    <text x="470" y="775">✓ Compact Hands: Bare caramel skin (~24px), exactly matching Leon's scale</text>
