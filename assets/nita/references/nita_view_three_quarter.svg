<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
  <!-- 02. NITA 3/4 VIEW — Cutenemi 2D Paper-Cutout Model Sheet -->
  <rect width="400" height="500" fill="#1b1e24"/>
  <ellipse cx="200" cy="458" rx="88" ry="15" fill="#101216"/>
  <text x="200" y="36" fill="#ffd166" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">NITA — 3/4 VIEW</text>
  <text x="200" y="58" fill="#a0a8b4" font-family="sans-serif" font-size="12" text-anchor="middle">Facing Viewer-Right • Proportions Locked to Front View</text>

  <g transform="translate(200, 265) scale(2.0)">
    <!-- BACK HAIR (behind hood, back-left side) -->
    <path d="M-26,-64 C-34,-64 -40,-52 -40,-36 C-40,-20 -34,-10 -26,-6 L-18,-12 C-26,-20 -30,-30 -30,-42 C-30,-54 -27,-60 -24,-62 Z"
          fill="#74403a" stroke="#1e1e2c" stroke-width="3.0" stroke-linejoin="round"/>

    <!-- 1. LEGS + FEET (back leg tucked, front leg out) -->
    <rect x="-10" y="38" width="18" height="22" rx="2" fill="#7c3a34" stroke="#1e1e2c" stroke-width="3.0"/>
    <path d="M-12,58 L6,58 C8,58 8,68 5,68 L-10,68 C-14,68 -14,58 -12,58 Z" fill="#a5683f" stroke="#1e1e2c" stroke-width="3.0"/>
    <rect x="10" y="38" width="20" height="22" rx="2" fill="#7c3a34" stroke="#1e1e2c" stroke-width="3.0"/>
    <path d="M8,58 L28,58 C30,58 30,68 27,68 L10,68 C6,68 6,58 8,58 Z" fill="#a5683f" stroke="#1e1e2c" stroke-width="3.0"/>

    <!-- 2. SKIRT (shifted right with turn) -->
    <path d="M-26,28 L34,28 L39,48 L6,56 L-32,48 Z" fill="#6ec9e0" stroke="#1e1e2c" stroke-width="3.2" stroke-linejoin="round"/>
    <line x1="-12" y1="30" x2="-14" y2="50" stroke="#1e1e2c" stroke-width="2.0"/>
    <line x1="20" y1="30" x2="26" y2="50" stroke="#1e1e2c" stroke-width="2.0"/>

    <!-- 3. TORSO (Leon path, shifted +4 right) -->
    <path d="M-24,-2 C-28,-2 -30,8 -30,22 C-30,36 -24,42 -16,42 L24,42 C32,42 38,36 38,22 C38,8 36,-2 32,-2 Z"
          fill="#2eb872" stroke="#1e1e2c" stroke-width="3.2"/>
    <path d="M-2,-2 Q4,8 10,-2 Z" fill="#a5683f" stroke="#1e1e2c" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- 4. NECKLACE (pendant swings right) -->
    <g transform="translate(6,2)">
      <path d="M-12,0 Q4,16 18,0" fill="none" stroke="#1e1e2c" stroke-width="2.0" stroke-linecap="round"/>
      <circle cx="4" cy="16" r="5.6" fill="#6ec6ff" stroke="#1e1e2c" stroke-width="2.6"/>
      <circle cx="4" cy="18" r="2.4" fill="#ffffff"/>
      <circle cx="0.8" cy="14" r="1.0" fill="#ffffff"/>
      <circle cx="4" cy="12.6" r="1.0" fill="#ffffff"/>
      <circle cx="7.2" cy="14" r="1.0" fill="#ffffff"/>
    </g>

    <!-- 5. ARMS + SMALL HANDS (far arm smaller) -->
    <path d="M-22,4 C-28,6 -32,16 -28,26 C-26,29 -23,30 -20,29 C-17,28 -19,20 -16,12 Z"
          fill="#e04646" stroke="#1e1e2c" stroke-width="2.8"/>
    <circle cx="-17.5" cy="29" r="5" fill="#a5683f" stroke="#1e1e2c" stroke-width="2.6"/>
    <rect x="-20.5" y="22.5" width="5" height="3.5" rx="1.5" fill="#1f3160" stroke="#1e1e2c" stroke-width="1.8"/>

    <path d="M28,2 C34,4 40,16 36,28 C34,32 30,34 26,32 C22,30 24,20 20,12 Z"
          fill="#e04646" stroke="#1e1e2c" stroke-width="3.0"/>
    <circle cx="22" cy="32" r="6" fill="#a5683f" stroke="#1e1e2c" stroke-width="2.8"/>
    <rect x="19" y="24" width="6" height="4" rx="1.5" fill="#1f3160" stroke="#1e1e2c" stroke-width="2.0"/>

    <!-- 6. HEAD + HOOD (shifted right for 3/4) -->
    <circle cx="-22" cy="-78" r="11" fill="#e04646" stroke="#1e1e2c" stroke-width="3.0"/>
    <circle cx="36" cy="-78" r="13" fill="#e04646" stroke="#1e1e2c" stroke-width="3.2"/>
    <path d="M8,-88 C-24,-88 -42,-66 -42,-30 C-42,0 -22,20 8,20 C38,20 58,0 58,-30 C58,-66 40,-88 8,-88 Z"
          fill="#e04646" stroke="#1e1e2c" stroke-width="3.5"/>
    <path d="M-4,-88 C0,-62 0,-58 -4,-52 L22,-52 C18,-58 18,-62 22,-88 Z"
          fill="#1f3160" stroke="#1e1e2c" stroke-width="3.0" stroke-linejoin="round"/>
    <ellipse cx="6" cy="-50" rx="4.5" ry="3.6" fill="#0e1730"/>

    <!-- Face opening + skin disc (offset right) -->
    <ellipse cx="7" cy="-24" rx="33" ry="29" fill="#6e2323" stroke="#1e1e2c" stroke-width="3.2"/>
    <ellipse cx="8" cy="-20" rx="30" ry="25" fill="#a5683f"/>

    <!-- Eyes: near bigger, far smaller -->
    <ellipse cx="-4" cy="-12" rx="7" ry="9" fill="#ffffff" stroke="#1e1e2c" stroke-width="3.0"/>
    <ellipse cx="22" cy="-12" rx="8" ry="10" fill="#ffffff" stroke="#1e1e2c" stroke-width="3.0"/>
    <circle cx="-4" cy="-10" r="4" fill="#1e1e2c"/>
    <circle cx="22" cy="-10" r="4.6" fill="#1e1e2c"/>
    <circle cx="-2.8" cy="-11.6" r="1.3" fill="#ffffff"/>
    <circle cx="23.4" cy="-11.6" r="1.5" fill="#ffffff"/>

    <!-- Brows + mouth -->
    <path d="M-14,-24 Q-5,-28 4,-25" stroke="#1e1e2c" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <path d="M13,-25 Q22,-28 31,-24" stroke="#1e1e2c" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <path d="M2,2 Q10,6 18,2" stroke="#1e1e2c" stroke-width="2.8" stroke-linecap="round" fill="none"/>

    </g>
</svg>