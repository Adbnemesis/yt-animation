<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <!-- Leon Canonical Spinner Blade: 4-Blade Swirling Curved Shuriken (Brawl Stars Style) -->
  <defs>
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#00e5ff" flood-opacity="0.8"/>
    </filter>
  </defs>
  <g transform="translate(18, 18)">
    <!-- Outer Soft Glow Aura -->
    <circle cx="0" cy="0" r="14" fill="#00e5ff" opacity="0.25"/>

    <!-- 4 Swirling Curved Scythe Blades -->
    <!-- Blade 1: Top-Right -->
    <path d="M 0,-4 C 4,-12 12,-15 14,-14 C 15,-12 13,-4 6,0 Z" 
          fill="#38bdf8" stroke="#00e5ff" stroke-width="1.2"/>
    <!-- Blade 2: Bottom-Right -->
    <path d="M 4,0 C 12,4 15,12 14,14 C 12,15 4,13 0,6 Z" 
          fill="#00e5ff" stroke="#7dd3fc" stroke-width="1.2"/>
    <!-- Blade 3: Bottom-Left -->
    <path d="M 0,4 C -4,12 -12,15 -14,14 C -15,12 -13,4 -6,0 Z" 
          fill="#38bdf8" stroke="#00e5ff" stroke-width="1.2"/>
    <!-- Blade 4: Top-Left -->
    <path d="M -4,0 C -12,-4 -15,-12 -14,-14 C -12,-15 -4,-13 0,-6 Z" 
          fill="#00e5ff" stroke="#7dd3fc" stroke-width="1.2"/>

    <!-- Inner Swirl Body -->
    <path d="M 0,-13 C 5,-8 8,-5 13,0 C 8,5 5,8 0,13 C -5,8 -8,5 -13,0 C -8,-5 -5,-8 0,-13 Z" 
          fill="#0284c7" stroke="#1e293b" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 0,-10 C 4,-6 6,-4 10,0 C 6,4 4,6 0,10 C -4,6 -6,4 -10,0 C -6,-4 -4,-6 0,-10 Z" 
          fill="#38bdf8"/>

    <!-- Deep Blue Center Hub -->
    <circle cx="0" cy="0" r="4.2" fill="#0369a1" stroke="#1e293b" stroke-width="1.8"/>
    <!-- Center Core Dot / Hole -->
    <circle cx="0" cy="0" r="2.0" fill="#0f172a"/>
    <!-- Spark Highlight -->
    <circle cx="-1.0" cy="-1.0" r="0.8" fill="#e0f2fe"/>
  </g>
</svg>
