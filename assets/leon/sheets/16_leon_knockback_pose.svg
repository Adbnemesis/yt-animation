<svg xmlns="http://www.w3.org/2000/svg" width="440" height="380" viewBox="0 0 440 380">
  <!-- 16. LEON KNOCKBACK POSE (AIRBORNE TUMBLE) — Cutenemi Reference Panel 07 -->
  <rect width="440" height="380" fill="#1b1e24"/>
  <!-- Trailing Shadow to show airborne knockback trajectory -->
  <ellipse cx="160" cy="345" rx="60" ry="10" fill="#101216"/>

  <text x="220" y="34" fill="#ffd166" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">LEON — KNOCKBACK POSE (AIRBORNE)</text>
  <text x="220" y="54" fill="#a0a8b4" font-family="sans-serif" font-size="11" text-anchor="middle">Heavy Impact Launch • Airborne Tumble • Lollipop Dislodged</text>

  <!-- Knockback Spin Lines -->
  <path d="M120,240 C100,200 120,160 160,150" stroke="#ffd166" stroke-width="2.5" stroke-dasharray="4,4" fill="none"/>
  <!-- Impact Star Accents -->
  <polygon points="110,180 114,188 122,190 116,196 118,204 110,200 102,204 104,196 98,190 106,188" fill="#ffd166"/>

  <!-- Dislodged Lollipop Flying Away! -->
  <g transform="translate(350, 140) rotate(45)">
    <line x1="0" y1="0" x2="16" y2="16" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="2" cy="2" r="4.0" fill="#e63946" stroke="#1e1e2c" stroke-width="1.8"/>
  </g>

  <!-- Character Hurled Airborne (Rotated -35 degrees) -->
  <g transform="translate(220, 200) scale(1.6) rotate(-35)">
    <!-- Flailing Chameleon Tail -->
    <path d="M-26,14 C-36,10 -44,16 -42,24 C-40,30 -34,32 -28,28" fill="#38b000" stroke="#1e1e2c" stroke-width="3.0"/>

    <!-- Splayed Legs -->
    <g transform="rotate(30, -10, 36)">
      <rect x="-16" y="36" width="16" height="20" rx="2" fill="#1f3160" stroke="#1e1e2c" stroke-width="2.8"/>
      <path d="M-18,54 L0,54 C2,54 2,64 -2,64 L-16,64 C-20,64 -20,54 -18,54 Z" fill="#c47d48" stroke="#1e1e2c" stroke-width="2.8"/>
    </g>
    <g transform="rotate(-30, 10, 36)">
      <rect x="0" y="36" width="16" height="20" rx="2" fill="#1f3160" stroke="#1e1e2c" stroke-width="2.8"/>
      <path d="M-2,54 L16,54 C18,54 18,64 14,64 L0,64 C-4,64 -4,54 -2,54 Z" fill="#c47d48" stroke="#1e1e2c" stroke-width="2.8"/>
    </g>

    <!-- Torso -->
    <path d="M-22,-2 C-26,-2 -28,8 -28,20 C-28,34 -22,40 -16,40 L16,40 C22,40 28,34 28,20 C28,8 26,-2 22,-2 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="3.0"/>

    <!-- Flailing Arms -->
    <g transform="rotate(-75, -16, 4)">
      <path d="M-20,0 C-24,2 -28,12 -26,20 C-24,24 -20,26 -16,24 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="2.6"/>
      <circle cx="-16" cy="24" r="6.5" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.5"/>
    </g>
    <g transform="rotate(75, 16, 4)">
      <path d="M16,0 C12,2 8,12 10,20 C12,24 16,26 20,24 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="2.6"/>
      <circle cx="16" cy="24" r="6.5" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.5"/>
    </g>

    <!-- Head & Hood -->
    <circle cx="-30" cy="-56" r="12" fill="#38b000" stroke="#1e1e2c" stroke-width="2.8"/>
    <path d="M-4,-82 C-32,-82 -46,-62 -46,-28 C-46,0 -26,18 2,18 C30,18 48,0 48,-28 C48,-62 26,-82 -4,-82 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="3.2"/>
    <circle cx="28" cy="-52" r="12" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.8"/>

    <ellipse cx="-2" cy="-22" rx="28" ry="24" fill="#1a2512" stroke="#1e1e2c" stroke-width="2.8"/>
    <ellipse cx="0" cy="-18" rx="25" ry="21" fill="#c47d48"/>

    <!-- Shocked Wide Eyes -->
    <circle cx="-7" cy="-20" r="6" fill="#ffffff" stroke="#1e1e2c" stroke-width="1.8"/>
    <circle cx="-7" cy="-20" r="1.8" fill="#1e1e2c"/>
    <circle cx="7" cy="-20" r="6" fill="#ffffff" stroke="#1e1e2c" stroke-width="1.8"/>
    <circle cx="7" cy="-20" r="1.8" fill="#1e1e2c"/>

    <!-- Wide Open Screaming/Shocked Mouth -->
    <ellipse cx="0" cy="-9" rx="5" ry="7" fill="#1e1e2c"/>
    <ellipse cx="0" cy="-8.5" rx="3.5" ry="4.5" fill="#eb4d4b"/>
  </g>
</svg>
