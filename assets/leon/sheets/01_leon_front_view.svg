<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
  <!-- 01. LEON FRONT VIEW — Cutenemi 2D Paper-Cutout Model Sheet -->
  <rect width="400" height="500" fill="#1b1e24"/>

  <!-- Grid / Pedestal Shadow -->
  <ellipse cx="200" cy="455" rx="80" ry="16" fill="#101216"/>

  <!-- TITLE -->
  <text x="200" y="36" fill="#ffd166" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">LEON — FRONT VIEW</text>
  <text x="200" y="58" fill="#a0a8b4" font-family="sans-serif" font-size="12" text-anchor="middle">Early South Park Paper-Cutout Construction • Head ≈ 45%</text>

  <!-- ASSEMBLED CHARACTER (Scale 2.2x centered) -->
  <g transform="translate(200, 260) scale(2.0)">
    <!-- 1. TAIL (Behind, Z = -2) -->
    <!-- (Hidden directly behind in front view) -->

    <!-- 2. LEGS & FEET (Z = -1) -->
    <!-- Shorts (Navy #1f3160) -->
    <rect x="-24" y="38" width="20" height="22" rx="2" fill="#1f3160" stroke="#1e1e2c" stroke-width="3.0"/>
    <rect x="4" y="38" width="20" height="22" rx="2" fill="#1f3160" stroke="#1e1e2c" stroke-width="3.0"/>
    <!-- Feet (Tanned Skin #c47d48) -->
    <path d="M-26,58 L-2,58 C0,58 0,68 -4,68 L-24,68 C-28,68 -28,58 -26,58 Z" fill="#c47d48" stroke="#1e1e2c" stroke-width="3.0"/>
    <path d="M2,58 L26,58 C28,58 28,68 24,68 L4,68 C0,68 0,58 2,58 Z" fill="#c47d48" stroke="#1e1e2c" stroke-width="3.0"/>

    <!-- 3. TORSO (Z = 0) -->
    <!-- Green Hoodie Jacket -->
    <path d="M-28,-2 C-32,-2 -34,8 -34,22 C-34,36 -28,42 -20,42 L20,42 C28,42 34,36 34,22 C34,8 32,-2 28,-2 Z"
          fill="#38b000" stroke="#1e1e2c" stroke-width="3.2"/>
    <!-- Center Zipper Line -->
    <line x1="0" y1="-2" x2="0" y2="42" stroke="#1e1e2c" stroke-width="2.2"/>
    <!-- Blue Pocket Pouch -->
    <path d="M-14,24 L14,24 L18,42 L-18,42 Z" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.8"/>
    <!-- Light Grey Zipper Pull Tab -->
    <rect x="-2.5" y="10" width="5" height="10" rx="1.5" fill="#ced4da" stroke="#1e1e2c" stroke-width="1.8"/>

    <!-- 4. ARMS & MITTENS (Front resting pose) -->
    <!-- Left Sleeve -->
    <path d="M-28,2 C-34,4 -40,16 -36,28 C-34,32 -30,34 -26,32 C-22,30 -24,20 -20,12 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="3.0"/>
    <!-- Left Blue Mitten -->
    <circle cx="-22" cy="32" r="7" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.8"/>

    <!-- Right Sleeve -->
    <path d="M28,2 C34,4 40,16 36,28 C34,32 30,34 26,32 C22,30 24,20 20,12 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="3.0"/>
    <!-- Right Blue Mitten -->
    <circle cx="22" cy="32" r="7" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.8"/>

    <!-- 5. HEAD & HOOD (Z = 1, 45% of height) -->
    <!-- Chameleon Ear Bumps -->
    <circle cx="-38" cy="-60" r="14" fill="#38b000" stroke="#1e1e2c" stroke-width="3.2"/>
    <circle cx="38" cy="-60" r="14" fill="#38b000" stroke="#1e1e2c" stroke-width="3.2"/>

    <!-- Green Chameleon Hood Outer Shell -->
    <path d="M0,-88 C-34,-88 -52,-66 -52,-30 C-52,0 -32,20 0,20 C32,20 52,0 52,-30 C52,-66 34,-88 0,-88 Z"
          fill="#38b000" stroke="#1e1e2c" stroke-width="3.5"/>

    <!-- Yellow Center Crest Stripe -->
    <path d="M-8,-88 C-6,-58 -6,-30 -8,-2 L8,-2 C6,-30 6,-58 8,-88 Z" fill="#ffd166" stroke="#1e1e2c" stroke-width="2.2"/>

    <!-- Blue Button Eyes with Black 'X' Stitch -->
    <circle cx="-35" cy="-58" r="12" fill="#1e90ff" stroke="#1e1e2c" stroke-width="3.0"/>
    <circle cx="-35" cy="-58" r="8" fill="#0077b6"/>
    <line x1="-40" y1="-63" x2="-30" y2="-53" stroke="#1e1e2c" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="-30" y1="-63" x2="-40" y2="-53" stroke="#1e1e2c" stroke-width="2.6" stroke-linecap="round"/>

    <circle cx="35" cy="-58" r="12" fill="#1e90ff" stroke="#1e1e2c" stroke-width="3.0"/>
    <circle cx="35" cy="-58" r="8" fill="#0077b6"/>
    <line x1="30" y1="-63" x2="40" y2="-53" stroke="#1e1e2c" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="40" y1="-63" x2="30" y2="-53" stroke="#1e1e2c" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Hood Face Opening (Dark interior recess) -->
    <ellipse cx="0" cy="-24" rx="33" ry="29" fill="#1a2512" stroke="#1e1e2c" stroke-width="3.2"/>

    <!-- 6. FACE (Tanned skin disc inside hood opening) -->
    <ellipse cx="0" cy="-20" rx="30" ry="25" fill="#c47d48"/>

    <!-- Signature Confident Smirk with Lollipop -->
    <path d="M-6,-8 Q2,-4 10,-8" stroke="#1e1e2c" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <!-- White Lollipop Stick -->
    <line x1="6" y1="-7" x2="16" y2="2" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
    <!-- Red Candy Tongue / Tip -->
    <circle cx="7" cy="-6" r="3.2" fill="#e63946" stroke="#1e1e2c" stroke-width="1.6"/>
  </g>
</svg>
