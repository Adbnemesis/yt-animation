<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440">
  <!-- 07. LEON WALK REFERENCE POSES (Walk 1 & Walk 2) — Cutenemi Reference Panel 07 -->
  <rect width="640" height="440" fill="#1b1e24"/>

  <text x="320" y="34" fill="#ffd166" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">LEON — WALK REFERENCE POSES</text>
  <text x="320" y="54" fill="#a0a8b4" font-family="sans-serif" font-size="11" text-anchor="middle">Walk 1: Contact Heel-Strike • Walk 2: Passing Mid-Cushion</text>

  <!-- Ground Shadows -->
  <ellipse cx="180" cy="405" rx="70" ry="12" fill="#101216"/>
  <ellipse cx="460" cy="405" rx="70" ry="12" fill="#101216"/>

  <!-- WALK 1: CONTACT (Stride with lead foot heel down, trailing foot toe up) -->
  <g transform="translate(180, 230) scale(1.6)">
    <!-- Chameleon Tail -->
    <path d="M-22,22 C-30,20 -38,26 -38,34 C-38,40 -32,44 -26,40 C-22,36 -24,30 -28,30" fill="#38b000" stroke="#1e1e2c" stroke-width="3.0"/>

    <!-- Legs in Stride -->
    <!-- Back Leg (Trailing) -->
    <g transform="rotate(-25, 0, 36)">
      <rect x="-16" y="36" width="16" height="20" rx="2" fill="#1f3160" stroke="#1e1e2c" stroke-width="2.8"/>
      <path d="M-18,54 L0,54 C2,54 2,64 -2,64 L-16,64 C-20,64 -20,54 -18,54 Z" fill="#c47d48" stroke="#1e1e2c" stroke-width="2.8"/>
    </g>
    <!-- Front Leg (Lead Heel Contact) -->
    <g transform="rotate(28, 0, 36)">
      <rect x="0" y="36" width="16" height="20" rx="2" fill="#1f3160" stroke="#1e1e2c" stroke-width="2.8"/>
      <path d="M-2,54 L16,54 C18,54 18,64 14,64 L0,64 C-4,64 -4,54 -2,54 Z" fill="#c47d48" stroke="#1e1e2c" stroke-width="2.8"/>
    </g>

    <!-- Torso -->
    <path d="M-22,-2 C-26,-2 -28,8 -28,20 C-28,34 -22,40 -16,40 L16,40 C22,40 28,34 28,20 C28,8 26,-2 22,-2 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="3.0"/>
    <path d="M-10,22 L10,22 L12,40 L-12,40 Z" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.6"/>

    <!-- Arms Counter-Swinging -->
    <g transform="rotate(25, -16, 4)">
      <path d="M-20,0 C-24,2 -28,12 -26,20 C-24,24 -20,26 -16,24 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="2.6"/>
      <circle cx="-16" cy="24" r="6.5" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.5"/>
    </g>
    <g transform="rotate(-25, 16, 4)">
      <path d="M16,0 C12,2 8,12 10,20 C12,24 16,26 20,24 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="2.6"/>
      <circle cx="16" cy="24" r="6.5" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.5"/>
    </g>

    <!-- Head & Hood (Slight forward cant) -->
    <circle cx="-30" cy="-56" r="12" fill="#38b000" stroke="#1e1e2c" stroke-width="2.8"/>
    <path d="M-4,-82 C-32,-82 -46,-62 -46,-28 C-46,0 -26,18 2,18 C30,18 48,0 48,-28 C48,-62 26,-82 -4,-82 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="3.2"/>
    <path d="M-10,-82 C-6,-56 -4,-28 -2,-2 L10,-2 C8,-28 6,-56 2,-82 Z" fill="#ffd166" stroke="#1e1e2c" stroke-width="2.0"/>
    <circle cx="28" cy="-52" r="12" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.8"/>
    <line x1="23" y1="-57" x2="33" y2="-47" stroke="#1e1e2c" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="33" y1="-57" x2="23" y2="-47" stroke="#1e1e2c" stroke-width="2.4" stroke-linecap="round"/>

    <ellipse cx="-2" cy="-22" rx="28" ry="24" fill="#1a2512" stroke="#1e1e2c" stroke-width="2.8"/>
    <ellipse cx="0" cy="-18" rx="25" ry="21" fill="#c47d48"/>
    <path d="M-4,-6 Q2,-2 8,-6" stroke="#1e1e2c" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <line x1="5" y1="-5" x2="13" y2="2" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="6" cy="-4" r="2.8" fill="#e63946"/>
  </g>
  <text x="180" y="426" fill="#ffd166" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">WALK 1 (CONTACT)</text>

  <!-- WALK 2: PASSING (One leg planted, one leg bent lifted in passing position) -->
  <g transform="translate(460, 230) scale(1.6)">
    <!-- Chameleon Tail -->
    <path d="M-22,22 C-30,20 -38,26 -38,34 C-38,40 -32,44 -26,40 C-22,36 -24,30 -28,30" fill="#38b000" stroke="#1e1e2c" stroke-width="3.0"/>

    <!-- Planted Straight Leg -->
    <rect x="-14" y="34" width="16" height="22" rx="2" fill="#1f3160" stroke="#1e1e2c" stroke-width="2.8"/>
    <path d="M-16,54 L2,54 C4,54 4,64 0,64 L-14,64 C-18,64 -18,54 -16,54 Z" fill="#c47d48" stroke="#1e1e2c" stroke-width="2.8"/>

    <!-- Passing Lifted Bent Leg -->
    <g transform="rotate(-30, 8, 36)">
      <rect x="6" y="36" width="16" height="18" rx="2" fill="#1f3160" stroke="#1e1e2c" stroke-width="2.8"/>
      <path d="M4,52 L20,52 C22,52 22,62 18,62 L6,62 C2,62 2,52 4,52 Z" fill="#c47d48" stroke="#1e1e2c" stroke-width="2.8"/>
    </g>

    <!-- Torso (Slight bob up) -->
    <path d="M-22,-4 C-26,-4 -28,6 -28,18 C-28,32 -22,38 -16,38 L16,38 C22,38 28,32 28,18 C28,6 26,-4 22,-4 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="3.0"/>
    <path d="M-10,20 L10,20 L12,38 L-12,38 Z" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.6"/>

    <!-- Arms Passing Center -->
    <path d="M-22,0 C-26,2 -28,12 -24,20 C-22,24 -18,24 -14,22 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="2.6"/>
    <circle cx="-16" cy="22" r="6.5" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.5"/>
    <path d="M18,0 C22,2 24,12 20,20 C18,24 14,24 10,22 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="2.6"/>
    <circle cx="14" cy="22" r="6.5" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.5"/>

    <!-- Head & Hood -->
    <circle cx="-30" cy="-58" r="12" fill="#38b000" stroke="#1e1e2c" stroke-width="2.8"/>
    <path d="M-4,-84 C-32,-84 -46,-64 -46,-30 C-46,-2 -26,16 2,16 C30,16 48,-2 48,-30 C48,-64 26,-84 -4,-84 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="3.2"/>
    <path d="M-10,-84 C-6,-58 -4,-30 -2,-4 L10,-4 C8,-30 6,-58 2,-84 Z" fill="#ffd166" stroke="#1e1e2c" stroke-width="2.0"/>
    <circle cx="28" cy="-54" r="12" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.8"/>
    <line x1="23" y1="-59" x2="33" y2="-49" stroke="#1e1e2c" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="33" y1="-59" x2="23" y2="-49" stroke="#1e1e2c" stroke-width="2.4" stroke-linecap="round"/>

    <ellipse cx="-2" cy="-24" rx="28" ry="24" fill="#1a2512" stroke="#1e1e2c" stroke-width="2.8"/>
    <ellipse cx="0" cy="-20" rx="25" ry="21" fill="#c47d48"/>
    <path d="M-4,-8 Q2,-4 8,-8" stroke="#1e1e2c" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <line x1="5" y1="-7" x2="13" y2="0" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="6" cy="-6" r="2.8" fill="#e63946"/>
  </g>
  <text x="460" y="426" fill="#ffd166" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">WALK 2 (PASSING)</text>
</svg>
