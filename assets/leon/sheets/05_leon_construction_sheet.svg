<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <!-- 05. LEON SEPARATED BODY-PART CONSTRUCTION SHEET (Cutenemi Reference Panel 04) -->
  <rect width="800" height="480" fill="#1b1e24"/>

  <text x="400" y="32" fill="#ffd166" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">LEON — BODY PARTS (SEPARATED CUT-PAPER LAYERS)</text>
  <text x="400" y="52" fill="#a0a8b4" font-family="sans-serif" font-size="12" text-anchor="middle">Layer Breakdown &amp; Rig Pivot Points • Reference Panel 04</text>

  <!-- ROW 1: HEAD & FACE COMPONENTS -->
  <!-- 1. FACE BASE -->
  <g transform="translate(100, 120)">
    <ellipse cx="0" cy="0" rx="30" ry="25" fill="#c47d48" stroke="#1e1e2c" stroke-width="3.0"/>
    <circle cx="0" cy="0" r="3" fill="#ff4757"/> <!-- Pivot marker -->
    <text x="0" y="38" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">FACE BASE</text>
  </g>

  <!-- 2. HOOD -->
  <g transform="translate(240, 120)">
    <circle cx="-24" cy="-24" r="10" fill="#38b000" stroke="#1e1e2c" stroke-width="2.5"/>
    <circle cx="24" cy="-24" r="10" fill="#38b000" stroke="#1e1e2c" stroke-width="2.5"/>
    <path d="M0,-38 C-26,-38 -38,-24 -38,0 C-38,22 -24,36 0,36 C24,36 38,22 38,0 C38,-24 26,-38 0,-38 Z"
          fill="#38b000" stroke="#1e1e2c" stroke-width="2.8"/>
    <path d="M-6,-38 C-4,-20 -4,0 -6,16 L6,16 C4,0 4,-20 6,-38 Z" fill="#ffd166" stroke="#1e1e2c" stroke-width="1.8"/>
    <circle cx="-22" cy="-22" r="8" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.0"/>
    <circle cx="22" cy="-22" r="8" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.0"/>
    <ellipse cx="0" cy="4" rx="24" ry="20" fill="#1a2512" stroke="#1e1e2c" stroke-width="2.4"/>
    <circle cx="0" cy="24" r="3" fill="#ff4757"/>
    <text x="0" y="48" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">HOOD</text>
  </g>

  <!-- 3. EYEBROWS -->
  <g transform="translate(380, 120)">
    <line x1="-20" y1="0" x2="-4" y2="0" stroke="#1e1e2c" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="4" y1="0" x2="20" y2="0" stroke="#1e1e2c" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="-12" cy="0" r="2.5" fill="#ff4757"/>
    <circle cx="12" cy="0" r="2.5" fill="#ff4757"/>
    <text x="0" y="38" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">EYEBROWS</text>
  </g>

  <!-- 4. EYES & PUPILS -->
  <g transform="translate(520, 120)">
    <ellipse cx="-12" cy="0" rx="8" ry="9" fill="#ffffff" stroke="#1e1e2c" stroke-width="2.2"/>
    <circle cx="-12" cy="0" r="3" fill="#1e1e2c"/>
    <ellipse cx="12" cy="0" rx="8" ry="9" fill="#ffffff" stroke="#1e1e2c" stroke-width="2.2"/>
    <circle cx="12" cy="0" r="3" fill="#1e1e2c"/>
    <text x="0" y="38" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">EYES &amp; PUPILS</text>
  </g>

  <!-- 5. MOUTHS + LOLLIPOP -->
  <g transform="translate(680, 120)">
    <path d="M-10,0 Q0,4 10,0" stroke="#1e1e2c" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <line x1="8" y1="0" x2="16" y2="8" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="9" cy="1" r="3.0" fill="#e63946"/>
    <text x="0" y="38" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">MOUTH + CANDY</text>
  </g>

  <!-- ROW 2: BODY, ARMS, HANDS, LEGS, FEET, TAIL -->
  <!-- 6. TORSO HOODIE -->
  <g transform="translate(100, 260)">
    <path d="M-22,-2 C-26,-2 -28,8 -28,20 C-28,34 -22,40 -16,40 L16,40 C22,40 28,34 28,20 C28,8 26,-2 22,-2 Z"
          fill="#38b000" stroke="#1e1e2c" stroke-width="3.0"/>
    <line x1="0" y1="-2" x2="0" y2="40" stroke="#1e1e2c" stroke-width="2.0"/>
    <path d="M-12,22 L12,22 L14,40 L-14,40 Z" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.4"/>
    <circle cx="0" cy="-2" r="3" fill="#ff4757"/>
    <text x="0" y="56" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TORSO</text>
  </g>

  <!-- 7. ARM L & ARM R -->
  <g transform="translate(230, 260)">
    <path d="M-20,0 C-24,2 -28,12 -26,20 C-24,24 -20,26 -16,24 C-12,22 -14,14 -12,8 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="2.5"/>
    <circle cx="-16" cy="0" r="3" fill="#ff4757"/> <!-- Shoulder pivot -->
    <path d="M20,0 C24,2 28,12 26,20 C24,24 20,26 16,24 C12,22 14,14 12,8 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="2.5"/>
    <circle cx="16" cy="0" r="3" fill="#ff4757"/> <!-- Shoulder pivot -->
    <text x="0" y="44" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ARM L / ARM R</text>
  </g>

  <!-- 8. HAND L & HAND R -->
  <g transform="translate(360, 260)">
    <circle cx="-14" cy="10" r="8" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.5"/>
    <circle cx="-14" cy="2" r="3" fill="#ff4757"/> <!-- Wrist pivot -->
    <circle cx="14" cy="10" r="8" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.5"/>
    <circle cx="14" cy="2" r="3" fill="#ff4757"/> <!-- Wrist pivot -->
    <text x="0" y="38" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">HAND L / HAND R</text>
  </g>

  <!-- 9. LEG L & LEG R -->
  <g transform="translate(480, 260)">
    <rect x="-20" y="0" width="16" height="20" rx="2" fill="#1f3160" stroke="#1e1e2c" stroke-width="2.5"/>
    <circle cx="-12" cy="0" r="3" fill="#ff4757"/> <!-- Hip pivot -->
    <rect x="4" y="0" width="16" height="20" rx="2" fill="#1f3160" stroke="#1e1e2c" stroke-width="2.5"/>
    <circle cx="12" cy="0" r="3" fill="#ff4757"/> <!-- Hip pivot -->
    <text x="0" y="38" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">LEG L / LEG R</text>
  </g>

  <!-- 10. FOOT L & FOOT R -->
  <g transform="translate(600, 260)">
    <path d="M-22,4 L-4,4 C-2,4 -2,14 -6,14 L-20,14 C-24,14 -24,4 -22,4 Z" fill="#c47d48" stroke="#1e1e2c" stroke-width="2.5"/>
    <circle cx="-13" cy="4" r="3" fill="#ff4757"/> <!-- Ankle pivot -->
    <path d="M4,4 L22,4 C24,4 24,14 20,14 L6,14 C2,14 2,4 4,4 Z" fill="#c47d48" stroke="#1e1e2c" stroke-width="2.5"/>
    <circle cx="13" cy="4" r="3" fill="#ff4757"/> <!-- Ankle pivot -->
    <text x="0" y="38" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">FOOT L / FOOT R</text>
  </g>

  <!-- 11. CHAMELEON TAIL -->
  <g transform="translate(720, 260)">
    <path d="M-10,0 C-18,-2 -24,4 -24,12 C-24,20 -18,24 -12,20 C-6,16 -8,8 -14,8"
          fill="#38b000" stroke="#1e1e2c" stroke-width="2.6"/>
    <circle cx="-13" cy="13" r="2.4" fill="#ffd166"/>
    <circle cx="-8" cy="0" r="3" fill="#ff4757"/> <!-- Tail base pivot -->
    <text x="0" y="38" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TAIL</text>
  </g>

  <!-- PIVOT LEGEND -->
  <g transform="translate(400, 430)">
    <circle cx="-120" cy="0" r="4" fill="#ff4757"/>
    <text x="-110" y="4" fill="#ff4757" font-family="sans-serif" font-size="12" font-weight="bold">● Red Dots = Concentric Bone2D Pivot Coordinates</text>
    <text x="140" y="4" fill="#ffd166" font-family="sans-serif" font-size="12">Flat Colors • 3.5px Outlines • Ready for Godot Rigging</text>
  </g>
</svg>
