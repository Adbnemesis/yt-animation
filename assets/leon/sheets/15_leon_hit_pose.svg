<svg xmlns="http://www.w3.org/2000/svg" width="360" height="460" viewBox="0 0 360 460">
  <!-- 15. LEON HIT POSE (WHIPLASH RECOIL) — Cutenemi Reference Panel 07 -->
  <rect width="360" height="460" fill="#1b1e24"/>
  <ellipse cx="180" cy="420" rx="70" ry="14" fill="#101216"/>

  <text x="180" y="34" fill="#ffd166" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">LEON — HIT POSE (RECOIL)</text>
  <text x="180" y="54" fill="#a0a8b4" font-family="sans-serif" font-size="11" text-anchor="middle">Whiplash Stagger • Squeezed Eyes • Zigzag Grimace</text>

  <g transform="translate(180, 245) scale(1.7) rotate(-14)">
    <!-- Trailing Chameleon Tail -->
    <path d="M-22,22 C-30,20 -38,26 -38,34 C-38,40 -32,44 -26,40 C-22,36 -24,30 -28,30" fill="#38b000" stroke="#1e1e2c" stroke-width="3.0"/>

    <!-- Unbalanced Feet Stagger -->
    <rect x="-24" y="36" width="18" height="20" rx="2" fill="#1f3160" stroke="#1e1e2c" stroke-width="2.8"/>
    <path d="M-26,54 L-2,54 C0,54 0,64 -4,64 L-24,64 C-28,64 -28,54 -26,54 Z" fill="#c47d48" stroke="#1e1e2c" stroke-width="2.8"/>
    <g transform="rotate(20, 10, 36)">
      <rect x="2" y="36" width="18" height="20" rx="2" fill="#1f3160" stroke="#1e1e2c" stroke-width="2.8"/>
      <path d="M0,54 L24,54 C26,54 26,64 22,64 L2,64 C-2,64 -2,54 0,54 Z" fill="#c47d48" stroke="#1e1e2c" stroke-width="2.8"/>
    </g>

    <!-- Torso (Jolted Back) -->
    <path d="M-26,-2 C-30,-2 -32,8 -32,22 C-32,36 -26,42 -18,42 L18,42 C26,42 32,36 32,22 C32,8 30,-2 26,-2 Z"
          fill="#38b000" stroke="#1e1e2c" stroke-width="3.2"/>

    <!-- Flailing Arms -->
    <g transform="rotate(-45, -18, 4)">
      <path d="M-22,0 C-26,2 -28,12 -26,20 C-24,24 -20,26 -16,24 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="2.6"/>
      <circle cx="-16" cy="24" r="6.5" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.5"/>
    </g>
    <g transform="rotate(45, 18, 4)">
      <path d="M16,0 C12,2 8,12 10,20 C12,24 16,26 20,24 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="2.6"/>
      <circle cx="16" cy="24" r="6.5" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.5"/>
    </g>

    <!-- Head Thrown Back -->
    <circle cx="-36" cy="-60" r="14" fill="#38b000" stroke="#1e1e2c" stroke-width="3.2"/>
    <circle cx="36" cy="-60" r="14" fill="#38b000" stroke="#1e1e2c" stroke-width="3.2"/>
    <path d="M0,-88 C-34,-88 -50,-66 -50,-30 C-50,0 -30,20 0,20 C30,20 50,0 50,-30 C50,-66 34,-88 0,-88 Z"
          fill="#38b000" stroke="#1e1e2c" stroke-width="3.5"/>
    <path d="M-8,-88 C-6,-58 -6,-30 -8,-2 L8,-2 C6,-30 6,-58 8,-88 Z" fill="#ffd166" stroke="#1e1e2c" stroke-width="2.2"/>
    <circle cx="-33" cy="-58" r="12" fill="#1e90ff" stroke="#1e1e2c" stroke-width="3.0"/>
    <circle cx="33" cy="-58" r="12" fill="#1e90ff" stroke="#1e1e2c" stroke-width="3.0"/>

    <ellipse cx="0" cy="-24" rx="32" ry="28" fill="#1a2512" stroke="#1e1e2c" stroke-width="3.2"/>
    <ellipse cx="0" cy="-20" rx="29" ry="24" fill="#c47d48"/>

    <!-- Squeezed Shut Hurt Eyes (><) -->
    <path d="M-14,-22 L-8,-18 L-14,-14" stroke="#1e1e2c" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <path d="M14,-22 L8,-18 L14,-14" stroke="#1e1e2c" stroke-width="2.6" stroke-linecap="round" fill="none"/>

    <!-- Zigzag Hurt Mouth -->
    <path d="M-8,-8 L-4,-11 L0,-6 L4,-10 L8,-7" stroke="#1e1e2c" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  </g>
</svg>
