<svg xmlns="http://www.w3.org/2000/svg" width="360" height="460" viewBox="0 0 360 460">
  <!-- 14. LEON LANDING POSE (IMPACT SQUASH) — Cutenemi Reference Panel 07 -->
  <rect width="360" height="460" fill="#1b1e24"/>
  <!-- Wide Compressed Ground Shadow -->
  <ellipse cx="180" cy="420" rx="90" ry="16" fill="#101216"/>

  <text x="180" y="34" fill="#ffd166" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">LEON — LANDING POSE (SQUASH)</text>
  <text x="180" y="54" fill="#a0a8b4" font-family="sans-serif" font-size="11" text-anchor="middle">Heavy Ground Contact • Deep Knee Bend • Wide Impact Squash</text>

  <!-- Deep Impact Squash (Scale X 1.2, Scale Y 0.8) -->
  <g transform="translate(180, 275) scale(2.0, 1.4)">
    <!-- Legs Splayed Outward in Deep Squat -->
    <rect x="-26" y="30" width="18" height="18" rx="2" fill="#1f3160" stroke="#1e1e2c" stroke-width="2.6"/>
    <rect x="8" y="30" width="18" height="18" rx="2" fill="#1f3160" stroke="#1e1e2c" stroke-width="2.6"/>
    <path d="M-28,46 L-4,46 C-2,46 -2,56 -6,56 L-26,56 C-30,56 -30,46 -28,46 Z" fill="#c47d48" stroke="#1e1e2c" stroke-width="2.6"/>
    <path d="M6,46 L30,46 C32,46 32,56 28,56 L8,56 C4,56 4,46 6,46 Z" fill="#c47d48" stroke="#1e1e2c" stroke-width="2.6"/>

    <!-- Squashed Wide Torso -->
    <path d="M-30,-2 C-34,-2 -36,6 -36,18 C-36,28 -30,34 -22,34 L22,34 C30,34 36,28 36,18 C36,6 34,-2 30,-2 Z"
          fill="#38b000" stroke="#1e1e2c" stroke-width="2.8"/>

    <!-- Bracing Hands Flared Out -->
    <g transform="rotate(35, -20, 4)">
      <path d="M-22,0 C-26,2 -28,12 -24,18 C-22,22 -18,22 -14,20 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="2.4"/>
      <circle cx="-16" cy="20" r="6.5" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.4"/>
    </g>
    <g transform="rotate(-35, 20, 4)">
      <path d="M14,0 C10,2 8,12 12,18 C14,22 18,22 22,20 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="2.4"/>
      <circle cx="16" cy="20" r="6.5" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.4"/>
    </g>

    <!-- Squashed Hood & Head -->
    <circle cx="-34" cy="-52" r="13" fill="#38b000" stroke="#1e1e2c" stroke-width="2.8"/>
    <circle cx="34" cy="-52" r="13" fill="#38b000" stroke="#1e1e2c" stroke-width="2.8"/>
    <path d="M0,-78 C-34,-78 -50,-56 -50,-24 C-50,0 -30,16 0,16 C30,16 50,0 50,-24 C50,-56 34,-78 0,-78 Z"
          fill="#38b000" stroke="#1e1e2c" stroke-width="3.0"/>
    <path d="M-8,-78 C-6,-50 -6,-24 -8,-2 L8,-2 C6,-24 6,-50 8,-78 Z" fill="#ffd166" stroke="#1e1e2c" stroke-width="2.0"/>
    <circle cx="-32" cy="-50" r="11" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.6"/>
    <circle cx="32" cy="-50" r="11" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.6"/>

    <ellipse cx="0" cy="-20" rx="30" ry="24" fill="#1a2512" stroke="#1e1e2c" stroke-width="2.8"/>
    <ellipse cx="0" cy="-17" rx="27" ry="20" fill="#c47d48"/>

    <!-- Impact Gritted Smile -->
    <path d="M-6,-6 Q2,-2 8,-6" stroke="#1e1e2c" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <line x1="5" y1="-5" x2="13" y2="2" stroke="#ffffff" stroke-width="2.0" stroke-linecap="round"/>
    <circle cx="6" cy="-4" r="2.6" fill="#e63946"/>
  </g>
</svg>
