<svg xmlns="http://www.w3.org/2000/svg" width="360" height="460" viewBox="0 0 360 460">
  <!-- 11. LEON ATTACK FOLLOW-THROUGH POSE — Cutenemi Reference Panel 07 -->
  <rect width="360" height="460" fill="#1b1e24"/>
  <ellipse cx="180" cy="420" rx="75" ry="14" fill="#101216"/>

  <text x="180" y="34" fill="#ffd166" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">LEON — ATTACK FOLLOW-THROUGH</text>
  <text x="180" y="54" fill="#a0a8b4" font-family="sans-serif" font-size="11" text-anchor="middle">Arm Downward Settle • Torso Forward Overshoot • Recovery</text>

  <g transform="translate(170, 245) scale(1.7) rotate(14)">
    <path d="M-26,14 C-36,10 -44,16 -42,24 C-40,30 -34,32 -28,28" fill="#38b000" stroke="#1e1e2c" stroke-width="3.0"/>

    <!-- Planted Stride -->
    <rect x="-14" y="36" width="16" height="22" rx="2" fill="#1f3160" stroke="#1e1e2c" stroke-width="2.8"/>
    <path d="M-16,56 L2,56 C4,56 4,66 0,66 L-14,66 C-18,66 -18,56 -16,56 Z" fill="#c47d48" stroke="#1e1e2c" stroke-width="2.8"/>
    <rect x="6" y="36" width="16" height="22" rx="2" fill="#1f3160" stroke="#1e1e2c" stroke-width="2.8"/>
    <path d="M4,56 L22,56 C24,56 24,66 20,66 L6,66 C2,66 2,56 4,56 Z" fill="#c47d48" stroke="#1e1e2c" stroke-width="2.8"/>

    <!-- Torso Leaning Forward -->
    <path d="M-22,-2 C-26,-2 -28,8 -28,20 C-28,34 -22,40 -16,40 L16,40 C22,40 28,34 28,20 C28,8 26,-2 22,-2 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="3.0"/>

    <!-- Arm Swept Downward/Past Body (Follow-through arc) -->
    <g transform="translate(16, 12) rotate(120)">
      <path d="M-8,-4 C-4,-4 14,-2 22,-2 C24,4 24,8 22,12 C14,12 -4,14 -8,14 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="2.8"/>
      <circle cx="28" cy="5" r="7.0" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.6"/>
    </g>

    <!-- Head & Hood -->
    <circle cx="-30" cy="-56" r="12" fill="#38b000" stroke="#1e1e2c" stroke-width="2.8"/>
    <path d="M-4,-82 C-32,-82 -46,-62 -46,-28 C-46,0 -26,18 2,18 C30,18 48,0 48,-28 C48,-62 26,-82 -4,-82 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="3.2"/>
    <path d="M-10,-82 C-6,-56 -4,-28 -2,-2 L10,-2 C8,-28 6,-56 2,-82 Z" fill="#ffd166" stroke="#1e1e2c" stroke-width="2.0"/>
    <circle cx="28" cy="-52" r="12" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.8"/>

    <ellipse cx="-2" cy="-22" rx="28" ry="24" fill="#1a2512" stroke="#1e1e2c" stroke-width="2.8"/>
    <ellipse cx="0" cy="-18" rx="25" ry="21" fill="#c47d48"/>

    <!-- Confident Smirk (Throw successful) -->
    <path d="M-4,-6 Q2,-2 8,-6" stroke="#1e1e2c" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <line x1="5" y1="-5" x2="13" y2="2" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="6" cy="-4" r="2.8" fill="#e63946"/>
  </g>
</svg>
