<svg xmlns="http://www.w3.org/2000/svg" width="360" height="460" viewBox="0 0 360 460">
  <!-- 12. LEON JUMP POSE (ASCENT) — Cutenemi Reference Panel 07 -->
  <rect width="360" height="460" fill="#1b1e24"/>
  <!-- Small Ground Shadow to emphasize height -->
  <ellipse cx="180" cy="425" rx="45" ry="8" fill="#101216"/>

  <text x="180" y="34" fill="#ffd166" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">LEON — JUMP POSE (ASCENT)</text>
  <text x="180" y="54" fill="#a0a8b4" font-family="sans-serif" font-size="11" text-anchor="middle">Airborne Leap • Legs Tucked Up • Arms Lifted</text>

  <g transform="translate(180, 210) scale(1.7)">
    <!-- Chameleon Tail Pointing Down -->
    <path d="M-22,22 C-28,26 -30,34 -26,38 C-22,42 -16,40 -16,34" fill="#38b000" stroke="#1e1e2c" stroke-width="3.0"/>

    <!-- Tucked Legs (Airborne) -->
    <g transform="rotate(-20, -10, 36)">
      <rect x="-14" y="34" width="16" height="18" rx="2" fill="#1f3160" stroke="#1e1e2c" stroke-width="2.8"/>
      <path d="M-16,50 L0,50 C2,50 2,60 -2,60 L-14,60 C-18,60 -18,50 -16,50 Z" fill="#c47d48" stroke="#1e1e2c" stroke-width="2.8"/>
    </g>
    <g transform="rotate(20, 10, 36)">
      <rect x="-2" y="34" width="16" height="18" rx="2" fill="#1f3160" stroke="#1e1e2c" stroke-width="2.8"/>
      <path d="M-4,50 L12,50 C14,50 14,60 10,60 L-2,60 C-6,60 -6,50 -4,50 Z" fill="#c47d48" stroke="#1e1e2c" stroke-width="2.8"/>
    </g>

    <!-- Torso (Slightly Stretched) -->
    <path d="M-24,-4 C-28,-4 -30,6 -30,20 C-30,34 -24,40 -16,40 L16,40 C24,40 30,34 30,20 C30,6 28,-4 24,-4 Z"
          fill="#38b000" stroke="#1e1e2c" stroke-width="3.0"/>

    <!-- Arms Raised Upward -->
    <g transform="rotate(-60, -16, 4)">
      <path d="M-20,0 C-24,2 -28,12 -26,20 C-24,24 -20,26 -16,24 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="2.6"/>
      <circle cx="-16" cy="24" r="6.5" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.5"/>
    </g>
    <g transform="rotate(60, 16, 4)">
      <path d="M16,0 C12,2 8,12 10,20 C12,24 16,26 20,24 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="2.6"/>
      <circle cx="16" cy="24" r="6.5" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.5"/>
    </g>

    <!-- Head & Hood -->
    <circle cx="-34" cy="-60" r="14" fill="#38b000" stroke="#1e1e2c" stroke-width="3.2"/>
    <circle cx="34" cy="-60" r="14" fill="#38b000" stroke="#1e1e2c" stroke-width="3.2"/>
    <path d="M0,-88 C-34,-88 -50,-66 -50,-30 C-50,0 -30,20 0,20 C30,20 50,0 50,-30 C50,-66 34,-88 0,-88 Z"
          fill="#38b000" stroke="#1e1e2c" stroke-width="3.5"/>
    <path d="M-8,-88 C-6,-58 -6,-30 -8,-2 L8,-2 C6,-30 6,-58 8,-88 Z" fill="#ffd166" stroke="#1e1e2c" stroke-width="2.2"/>
    <circle cx="-33" cy="-58" r="12" fill="#1e90ff" stroke="#1e1e2c" stroke-width="3.0"/>
    <circle cx="33" cy="-58" r="12" fill="#1e90ff" stroke="#1e1e2c" stroke-width="3.0"/>

    <ellipse cx="0" cy="-24" rx="32" ry="28" fill="#1a2512" stroke="#1e1e2c" stroke-width="3.2"/>
    <ellipse cx="0" cy="-20" rx="29" ry="24" fill="#c47d48"/>

    <!-- Happy Jump Smile -->
    <path d="M-6,-6 Q0,4 6,-6 Z" fill="#eb4d4b" stroke="#1e1e2c" stroke-width="2.0"/>
    <line x1="5" y1="-4" x2="13" y2="3" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="6" cy="-3" r="2.8" fill="#e63946"/>
  </g>
</svg>
