<svg xmlns="http://www.w3.org/2000/svg" width="360" height="460" viewBox="0 0 360 460">
  <!-- 09. LEON ATTACK ANTICIPATION POSE — Cutenemi Reference Panel 07 -->
  <rect width="360" height="460" fill="#1b1e24"/>
  <ellipse cx="180" cy="420" rx="70" ry="14" fill="#101216"/>

  <text x="180" y="34" fill="#ffd166" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">LEON — ATTACK ANTICIPATION</text>
  <text x="180" y="54" fill="#a0a8b4" font-family="sans-serif" font-size="11" text-anchor="middle">Coiled Energy • Deep Crouch • Arm Pulled Back Ready to Strike</text>

  <g transform="translate(180, 255) scale(1.7) rotate(-8)">
    <!-- Chameleon Tail Tucked -->
    <path d="M-24,20 C-32,18 -40,24 -40,32 C-40,38 -34,42 -28,38" fill="#38b000" stroke="#1e1e2c" stroke-width="3.0"/>

    <!-- Deep Crouch Legs -->
    <rect x="-24" y="34" width="18" height="18" rx="2" fill="#1f3160" stroke="#1e1e2c" stroke-width="2.8"/>
    <rect x="2" y="34" width="18" height="18" rx="2" fill="#1f3160" stroke="#1e1e2c" stroke-width="2.8"/>
    <path d="M-26,50 L-2,50 C0,50 0,60 -4,60 L-24,60 C-28,60 -28,50 -26,50 Z" fill="#c47d48" stroke="#1e1e2c" stroke-width="2.8"/>
    <path d="M0,50 L24,50 C26,50 26,60 22,60 L2,60 C-2,60 -2,50 0,50 Z" fill="#c47d48" stroke="#1e1e2c" stroke-width="2.8"/>

    <!-- Squashed Torso -->
    <path d="M-28,-2 C-32,-2 -34,6 -34,18 C-34,30 -28,36 -20,36 L20,36 C28,36 34,30 34,18 C34,6 32,-2 28,-2 Z"
          fill="#38b000" stroke="#1e1e2c" stroke-width="3.0"/>
    <line x1="0" y1="-2" x2="0" y2="36" stroke="#1e1e2c" stroke-width="2.0"/>

    <!-- Left Arm Tucked Front -->
    <g transform="rotate(30, -18, 0)">
      <path d="M-22,0 C-26,2 -28,12 -24,18 C-22,22 -18,22 -14,20 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="2.6"/>
      <circle cx="-16" cy="20" r="6.5" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.5"/>
    </g>

    <!-- Right Arm Pulled Far Back (Coiling Strike) -->
    <g transform="rotate(-65, 20, 0)">
      <path d="M14,0 C10,2 6,12 8,20 C10,24 14,26 18,24 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="2.6"/>
      <circle cx="14" cy="24" r="7.0" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.5"/>
      <!-- Spinner Shuriken Blade Held in Hand -->
      <polygon points="14,16 22,24 14,32 6,24" fill="#ced4da" stroke="#1e1e2c" stroke-width="2.0"/>
    </g>

    <!-- Head & Hood (Angled Down Focused) -->
    <circle cx="-34" cy="-56" r="12" fill="#38b000" stroke="#1e1e2c" stroke-width="2.8"/>
    <circle cx="34" cy="-56" r="12" fill="#38b000" stroke="#1e1e2c" stroke-width="2.8"/>
    <path d="M0,-84 C-32,-84 -48,-64 -48,-30 C-48,-2 -28,16 0,16 C28,16 48,-2 48,-30 C48,-64 32,-84 0,-84 Z"
          fill="#38b000" stroke="#1e1e2c" stroke-width="3.2"/>
    <path d="M-8,-84 C-6,-58 -6,-30 -8,-2 L8,-2 C6,-30 6,-58 8,-84 Z" fill="#ffd166" stroke="#1e1e2c" stroke-width="2.0"/>
    <circle cx="-32" cy="-54" r="11" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.8"/>
    <circle cx="32" cy="-54" r="11" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.8"/>

    <ellipse cx="0" cy="-24" rx="30" ry="26" fill="#1a2512" stroke="#1e1e2c" stroke-width="2.8"/>
    <ellipse cx="0" cy="-20" rx="27" ry="23" fill="#c47d48"/>

    <!-- Angry / Focused Gritted Teeth -->
    <rect x="-8" y="-8" width="16" height="6" rx="2" fill="#ffffff" stroke="#1e1e2c" stroke-width="2.0"/>
    <line x1="-8" y1="-5" x2="8" y2="-5" stroke="#1e1e2c" stroke-width="1.5"/>
  </g>
</svg>
