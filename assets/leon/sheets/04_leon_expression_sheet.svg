<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <!-- 04. LEON EXPRESSION SHEET — 10 Standard Expressions (Cutenemi Reference Panel 03) -->
  <rect width="800" height="420" fill="#1b1e24"/>

  <text x="400" y="32" fill="#ffd166" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">LEON — 10 EXPRESSION COMBINATION SHEET</text>
  <text x="400" y="52" fill="#a0a8b4" font-family="sans-serif" font-size="12" text-anchor="middle">Paper-Cutout Modular Eye &amp; Mouth Swaps • Reference Panel 03</text>

  <defs>
    <!-- Standard Mini-Head Hood Base Template -->
    <g id="mini-hood">
      <circle cx="-24" cy="-42" r="10" fill="#38b000" stroke="#1e1e2c" stroke-width="2.5"/>
      <circle cx="24" cy="-42" r="10" fill="#38b000" stroke="#1e1e2c" stroke-width="2.5"/>
      <path d="M0,-62 C-26,-62 -38,-46 -38,-20 C-38,2 -24,16 0,16 C24,16 38,2 38,-20 C38,-46 26,-62 0,-62 Z"
            fill="#38b000" stroke="#1e1e2c" stroke-width="2.8"/>
      <path d="M-6,-62 C-4,-40 -4,-20 -6,0 L6,0 C4,-20 4,-40 6,-62 Z" fill="#ffd166" stroke="#1e1e2c" stroke-width="1.8"/>
      <!-- Button Eyes -->
      <circle cx="-24" cy="-40" r="8" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.0"/>
      <line x1="-28" y1="-44" x2="-20" y2="-36" stroke="#1e1e2c" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="-20" y1="-44" x2="-28" y2="-36" stroke="#1e1e2c" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="24" cy="-40" r="8" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.0"/>
      <line x1="20" y1="-44" x2="28" y2="-36" stroke="#1e1e2c" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="28" y1="-44" x2="20" y2="-36" stroke="#1e1e2c" stroke-width="1.8" stroke-linecap="round"/>
      <!-- Face Recess & Skin Base -->
      <ellipse cx="0" cy="-16" rx="24" ry="20" fill="#1a2512" stroke="#1e1e2c" stroke-width="2.4"/>
      <ellipse cx="0" cy="-13" rx="22" ry="17" fill="#c47d48"/>
    </g>
  </defs>

  <!-- ROW 1 (y = 140): NEUTRAL, HAPPY, ANGRY, SHOCKED, SAD -->
  <!-- 1. NEUTRAL -->
  <g transform="translate(80, 140)">
    <use href="#mini-hood"/>
    <!-- Smirk + Lollipop -->
    <path d="M-4,-4 Q2,0 8,-4" stroke="#1e1e2c" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <line x1="5" y1="-3" x2="13" y2="4" stroke="#ffffff" stroke-width="2.0" stroke-linecap="round"/>
    <circle cx="6" cy="-2.5" r="2.6" fill="#e63946"/>
    <text x="0" y="32" fill="#ffd166" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">NEUTRAL</text>
  </g>

  <!-- 2. HAPPY -->
  <g transform="translate(240, 140)">
    <use href="#mini-hood"/>
    <!-- Happy Eyes Arcs (^^) -->
    <path d="M-13,-14 Q-8,-19 -3,-14" stroke="#1e1e2c" stroke-width="2.0" stroke-linecap="round" fill="none"/>
    <path d="M3,-14 Q8,-19 13,-14" stroke="#1e1e2c" stroke-width="2.0" stroke-linecap="round" fill="none"/>
    <!-- Wide Open Smile + Lollipop -->
    <path d="M-6,-5 Q0,5 8,-5 Z" fill="#eb4d4b" stroke="#1e1e2c" stroke-width="2.0"/>
    <line x1="6" y1="-3" x2="14" y2="4" stroke="#ffffff" stroke-width="2.0" stroke-linecap="round"/>
    <circle cx="7" cy="-2" r="2.6" fill="#e63946"/>
    <text x="0" y="32" fill="#ffd166" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">HAPPY</text>
  </g>

  <!-- 3. ANGRY -->
  <g transform="translate(400, 140)">
    <use href="#mini-hood"/>
    <!-- Angled Brows -->
    <line x1="-12" y1="-14" x2="-2" y2="-10" stroke="#1e1e2c" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="12" y1="-14" x2="2" y2="-10" stroke="#1e1e2c" stroke-width="2.4" stroke-linecap="round"/>
    <!-- Clenched Teeth -->
    <rect x="-8" y="-6" width="16" height="6" rx="2" fill="#ffffff" stroke="#1e1e2c" stroke-width="2.0"/>
    <line x1="-8" y1="-3" x2="8" y2="-3" stroke="#1e1e2c" stroke-width="1.5"/>
    <text x="0" y="32" fill="#ffd166" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ANGRY</text>
  </g>

  <!-- 4. SHOCKED -->
  <g transform="translate(560, 140)">
    <use href="#mini-hood"/>
    <!-- Wide Open Paper Eye Discs with Dots (South Park Style!) -->
    <circle cx="-8" cy="-14" r="6.5" fill="#ffffff" stroke="#1e1e2c" stroke-width="2.0"/>
    <circle cx="-8" cy="-14" r="2.0" fill="#1e1e2c"/>
    <circle cx="8" cy="-14" r="6.5" fill="#ffffff" stroke="#1e1e2c" stroke-width="2.0"/>
    <circle cx="8" cy="-14" r="2.0" fill="#1e1e2c"/>
    <!-- Tall 'O' Mouth -->
    <ellipse cx="0" cy="-4" rx="4.5" ry="6" fill="#1e1e2c" stroke="#1e1e2c" stroke-width="2.0"/>
    <ellipse cx="0" cy="-3.5" rx="3.0" ry="4.5" fill="#eb4d4b"/>
    <text x="0" y="32" fill="#ffd166" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SHOCKED</text>
  </g>

  <!-- 5. SAD -->
  <g transform="translate(720, 140)">
    <use href="#mini-hood"/>
    <!-- Drooping Brows -->
    <line x1="-12" y1="-10" x2="-2" y2="-14" stroke="#1e1e2c" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="12" y1="-10" x2="2" y2="-14" stroke="#1e1e2c" stroke-width="2.4" stroke-linecap="round"/>
    <!-- Curved Frown -->
    <path d="M-6,-2 Q0,-8 6,-2" stroke="#1e1e2c" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <text x="0" y="32" fill="#ffd166" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SAD</text>
  </g>

  <!-- ROW 2 (y = 280): HURT, SCARED, CONFUSED, SMUG, LAUGHING -->
  <!-- 6. HURT -->
  <g transform="translate(80, 280)">
    <use href="#mini-hood"/>
    <!-- Squeezed Shut Eyes (><) -->
    <path d="M-11,-15 L-7,-12 L-11,-9" stroke="#1e1e2c" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M11,-15 L7,-12 L11,-9" stroke="#1e1e2c" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <!-- Zigzag Hurt Mouth -->
    <path d="M-7,-4 L-3,-6 L1,-2 L5,-5 L8,-3" stroke="#1e1e2c" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <text x="0" y="32" fill="#ffd166" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">HURT</text>
  </g>

  <!-- 7. SCARED -->
  <g transform="translate(240, 280)">
    <use href="#mini-hood"/>
    <!-- Wide Trembling Eyes -->
    <circle cx="-8" cy="-14" r="7" fill="#ffffff" stroke="#1e1e2c" stroke-width="2.0"/>
    <circle cx="-8" cy="-14" r="1.6" fill="#1e1e2c"/>
    <circle cx="8" cy="-14" r="7" fill="#ffffff" stroke="#1e1e2c" stroke-width="2.0"/>
    <circle cx="8" cy="-14" r="1.6" fill="#1e1e2c"/>
    <!-- Chattering Wavy Mouth -->
    <path d="M-7,-5 Q-4,-7 0,-4 Q4,-7 7,-5 L6,-1 Q0,2 -6,-1 Z" fill="#eb4d4b" stroke="#1e1e2c" stroke-width="1.8"/>
    <text x="0" y="32" fill="#ffd166" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SCARED</text>
  </g>

  <!-- 8. CONFUSED -->
  <g transform="translate(400, 280)">
    <use href="#mini-hood"/>
    <!-- One Raised Brow, One Flat Brow (?_?) -->
    <line x1="-12" y1="-16" x2="-2" y2="-12" stroke="#1e1e2c" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="12" y1="-11" x2="2" y2="-11" stroke="#1e1e2c" stroke-width="2.4" stroke-linecap="round"/>
    <!-- Asymmetrical Diagonal Slant Mouth -->
    <path d="M-6,-2 Q1,-1 7,-6" stroke="#1e1e2c" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <text x="0" y="32" fill="#ffd166" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CONFUSED</text>
  </g>

  <!-- 9. SMUG -->
  <g transform="translate(560, 280)">
    <use href="#mini-hood"/>
    <!-- Half-Lidded Eyes & Cocked Brow -->
    <line x1="-12" y1="-14" x2="-2" y2="-12" stroke="#1e1e2c" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M3,-14 Q8,-18 13,-13" stroke="#1e1e2c" stroke-width="2.0" stroke-linecap="round" fill="none"/>
    <!-- Sideways Smirk + Lollipop -->
    <path d="M-5,-3 Q1,-2 8,-7" stroke="#1e1e2c" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <line x1="6" y1="-5" x2="14" y2="2" stroke="#ffffff" stroke-width="2.0" stroke-linecap="round"/>
    <circle cx="7" cy="-4" r="2.6" fill="#e63946"/>
    <text x="0" y="32" fill="#ffd166" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SMUG</text>
  </g>

  <!-- 10. LAUGHING -->
  <g transform="translate(720, 280)">
    <use href="#mini-hood"/>
    <!-- Arched Happy Eyes (^^) -->
    <path d="M-13,-14 Q-8,-19 -3,-14" stroke="#1e1e2c" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M3,-14 Q8,-19 13,-14" stroke="#1e1e2c" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <!-- Wide Open Laughing Mouth with Tongue -->
    <path d="M-8,-6 L8,-6 Q0,8 -8,-6 Z" fill="#1e1e2c" stroke="#1e1e2c" stroke-width="2.0"/>
    <path d="M-4,-1 Q0,5 4,-1 Z" fill="#eb4d4b"/>
    <text x="0" y="32" fill="#ffd166" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">LAUGHING</text>
  </g>
</svg>
