<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440">
  <!-- 08. LEON RUN REFERENCE POSES (Run 1 & Run 2) — Cutenemi Reference Panel 07 -->
  <rect width="640" height="440" fill="#1b1e24"/>

  <text x="320" y="34" fill="#ffd166" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">LEON — RUN REFERENCE POSES</text>
  <text x="320" y="54" fill="#a0a8b4" font-family="sans-serif" font-size="11" text-anchor="middle">Run 1: Deep Forward Lean Stride • Run 2: Airborne Flight Phase</text>

  <ellipse cx="180" cy="405" rx="75" ry="12" fill="#101216"/>
  <ellipse cx="460" cy="405" rx="60" ry="10" fill="#101216"/> <!-- Smaller shadow for airborne pose -->

  <!-- RUN 1: FORWARD STRIDE (Deep forward torso lean, trailing leg extended) -->
  <g transform="translate(180, 230) scale(1.6) rotate(10)">
    <!-- Chameleon Tail Drag -->
    <path d="M-26,18 C-36,14 -44,20 -42,28 C-40,34 -34,36 -28,32" fill="#38b000" stroke="#1e1e2c" stroke-width="3.0"/>

    <!-- Wide Running Stride Legs -->
    <g transform="rotate(-40, -10, 36)">
      <rect x="-16" y="36" width="16" height="22" rx="2" fill="#1f3160" stroke="#1e1e2c" stroke-width="2.8"/>
      <path d="M-18,56 L0,56 C2,56 2,66 -2,66 L-16,66 C-20,66 -20,56 -18,56 Z" fill="#c47d48" stroke="#1e1e2c" stroke-width="2.8"/>
    </g>
    <g transform="rotate(45, 10, 36)">
      <rect x="0" y="36" width="16" height="22" rx="2" fill="#1f3160" stroke="#1e1e2c" stroke-width="2.8"/>
      <path d="M-2,56 L16,56 C18,56 18,66 14,66 L0,66 C-4,66 -4,56 -2,56 Z" fill="#c47d48" stroke="#1e1e2c" stroke-width="2.8"/>
    </g>

    <!-- Torso -->
    <path d="M-22,-2 C-26,-2 -28,8 -28,20 C-28,34 -22,40 -16,40 L16,40 C22,40 28,34 28,20 C28,8 26,-2 22,-2 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="3.0"/>
    <path d="M-10,22 L10,22 L12,40 L-12,40 Z" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.6"/>

    <!-- Dynamic Pumping Arms -->
    <g transform="rotate(50, -16, 4)">
      <path d="M-20,0 C-24,2 -28,12 -26,20 C-24,24 -20,26 -16,24 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="2.6"/>
      <circle cx="-16" cy="24" r="6.5" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.5"/>
    </g>
    <g transform="rotate(-50, 16, 4)">
      <path d="M16,0 C12,2 8,12 10,20 C12,24 16,26 20,24 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="2.6"/>
      <circle cx="16" cy="24" r="6.5" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.5"/>
    </g>

    <!-- Head & Hood -->
    <circle cx="-30" cy="-56" r="12" fill="#38b000" stroke="#1e1e2c" stroke-width="2.8"/>
    <path d="M-4,-82 C-32,-82 -46,-62 -46,-28 C-46,0 -26,18 2,18 C30,18 48,0 48,-28 C48,-62 26,-82 -4,-82 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="3.2"/>
    <path d="M-10,-82 C-6,-56 -4,-28 -2,-2 L10,-2 C8,-28 6,-56 2,-82 Z" fill="#ffd166" stroke="#1e1e2c" stroke-width="2.0"/>
    <circle cx="28" cy="-52" r="12" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.8"/>
    <line x1="23" y1="-57" x2="33" y2="-47" stroke="#1e1e2c" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="33" y1="-57" x2="23" y2="-47" stroke="#1e1e2c" stroke-width="2.4" stroke-linecap="round"/>

    <ellipse cx="-2" cy="-22" rx="28" ry="24" fill="#1a2512" stroke="#1e1e2c" stroke-width="2.8"/>
    <ellipse cx="0" cy="-18" rx="25" ry="21" fill="#c47d48"/>
    <path d="M-4,-6 Q2,-2 8,-6" stroke="#1e1e2c" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <line x1="5" y1="-5" x2="13" y2="2" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="6" cy="-4" r="2.8" fill="#e63946"/>
  </g>
  <text x="180" y="426" fill="#ffd166" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">RUN 1 (STRIDE)</text>

  <!-- RUN 2: AIRBORNE FLIGHT (Lifted off ground, both feet airborne) -->
  <g transform="translate(460, 205) scale(1.6) rotate(14)">
    <!-- Chameleon Tail Floating -->
    <path d="M-28,16 C-38,10 -46,18 -44,26 C-42,32 -36,34 -30,30" fill="#38b000" stroke="#1e1e2c" stroke-width="3.0"/>

    <!-- Both Legs Tucked / Airborne -->
    <g transform="rotate(-50, -10, 36)">
      <rect x="-16" y="36" width="16" height="20" rx="2" fill="#1f3160" stroke="#1e1e2c" stroke-width="2.8"/>
      <path d="M-18,54 L0,54 C2,54 2,64 -2,64 L-16,64 C-20,64 -20,54 -18,54 Z" fill="#c47d48" stroke="#1e1e2c" stroke-width="2.8"/>
    </g>
    <g transform="rotate(35, 10, 36)">
      <rect x="0" y="36" width="16" height="20" rx="2" fill="#1f3160" stroke="#1e1e2c" stroke-width="2.8"/>
      <path d="M-2,54 L16,54 C18,54 18,64 14,64 L0,64 C-4,64 -4,54 -2,54 Z" fill="#c47d48" stroke="#1e1e2c" stroke-width="2.8"/>
    </g>

    <!-- Torso -->
    <path d="M-22,-2 C-26,-2 -28,8 -28,20 C-28,34 -22,40 -16,40 L16,40 C22,40 28,34 28,20 C28,8 26,-2 22,-2 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="3.0"/>
    <path d="M-10,22 L10,22 L12,40 L-12,40 Z" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.6"/>

    <!-- Wide Pumping Arms -->
    <g transform="rotate(-60, -16, 4)">
      <path d="M-20,0 C-24,2 -28,12 -26,20 C-24,24 -20,26 -16,24 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="2.6"/>
      <circle cx="-16" cy="24" r="6.5" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.5"/>
    </g>
    <g transform="rotate(65, 16, 4)">
      <path d="M16,0 C12,2 8,12 10,20 C12,24 16,26 20,24 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="2.6"/>
      <circle cx="16" cy="24" r="6.5" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.5"/>
    </g>

    <!-- Head & Hood -->
    <circle cx="-30" cy="-56" r="12" fill="#38b000" stroke="#1e1e2c" stroke-width="2.8"/>
    <path d="M-4,-82 C-32,-82 -46,-62 -46,-28 C-46,0 -26,18 2,18 C30,18 48,0 48,-28 C48,-62 26,-82 -4,-82 Z" fill="#38b000" stroke="#1e1e2c" stroke-width="3.2"/>
    <path d="M-10,-82 C-6,-56 -4,-28 -2,-2 L10,-2 C8,-28 6,-56 2,-82 Z" fill="#ffd166" stroke="#1e1e2c" stroke-width="2.0"/>
    <circle cx="28" cy="-52" r="12" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.8"/>
    <line x1="23" y1="-57" x2="33" y2="-47" stroke="#1e1e2c" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="33" y1="-57" x2="23" y2="-47" stroke="#1e1e2c" stroke-width="2.4" stroke-linecap="round"/>

    <ellipse cx="-2" cy="-22" rx="28" ry="24" fill="#1a2512" stroke="#1e1e2c" stroke-width="2.8"/>
    <ellipse cx="0" cy="-18" rx="25" ry="21" fill="#c47d48"/>
    <!-- Confident Running Grin -->
    <path d="M-4,-6 Q2,-1 8,-6" stroke="#1e1e2c" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <line x1="5" y1="-5" x2="13" y2="2" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="6" cy="-4" r="2.8" fill="#e63946"/>
  </g>
  <text x="460" y="426" fill="#ffd166" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">RUN 2 (AIRBORNE FLIGHT)</text>
</svg>
