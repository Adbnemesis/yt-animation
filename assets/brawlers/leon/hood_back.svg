  <!-- Hood Yellow Center Crest Stripe (extending full length down back) -->
  <path d="M54,6 C58,6 58,60 56,114 L72,114 C70,60 70,6 74,6 Z"
        fill="#ffd166" stroke="#1e1e2c" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Profile Button Eyes visible from back side edges -->
  <path d="M14,32 C20,32 22,48 14,48 Z" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.5"/>
  <path d="M114,32 C108,32 106,48 114,48 Z" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.5"/>
