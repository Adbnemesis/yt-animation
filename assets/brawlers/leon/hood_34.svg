<svg xmlns="http://www.w3.org/2000/svg" width="128" height="120" viewBox="0 0 128 120">
  <!-- Leon Chameleon Hood (3/4 View, turned toward viewer's right) -->
  <!-- Chameleon Ear Crest (Far Side) -->
  <circle cx="100" cy="36" r="16" fill="#38b000" stroke="#1e1e2c" stroke-width="3.5"/>

  <!-- Main Hood 3/4 Silhouette -->
  <path d="M68,6 C94,6 114,28 114,64 C114,94 92,114 60,114 C32,114 12,92 12,64 C12,30 34,6 68,6 Z"
        fill="#38b000" stroke="#1e1e2c" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Yellow Stripe Curving in 3/4 Perspective to Right -->
  <path d="M80,6 C76,6 72,32 70,52 L58,52 C62,32 66,6 62,6 Z"
        fill="#ffd166" stroke="#1e1e2c" stroke-width="2.5"/>

  <!-- Blue Button Eye with Stitched 'X' (Far Side, Viewer's Left) -->
  <circle cx="36" cy="44" r="15" fill="#1e90ff" stroke="#1e1e2c" stroke-width="3.5"/>
  <circle cx="36" cy="44" r="11" fill="#0077b6"/>
  <line x1="42" y1="38" x2="30" y2="50" stroke="#1e1e2c" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="30" y1="38" x2="42" y2="50" stroke="#1e1e2c" stroke-width="3.2" stroke-linecap="round"/>

  <!-- 3/4 Face Cavity Cutout Hole (Shifted to Viewer's Right) -->
  <ellipse cx="70" cy="74" rx="34" ry="32" fill="#1a2512" stroke="#1e1e2c" stroke-width="3.5"/>
</svg>
