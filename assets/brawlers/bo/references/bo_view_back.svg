<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <rect width="800" height="800" fill="#181a20"/>
  <text x="400" y="48" fill="#ffd166" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">BO — BACK VIEW (PRODUCTION ASSET)</text>
  <text x="400" y="74" fill="#a0aab8" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">White Eagle Cowl &amp; Orange Crest • Diagonal Quiver with Beak • Muscular Back &amp; Recurve Bow</text>
  <ellipse cx="400" cy="710" rx="145" ry="20" fill="#101216"/>

  <g transform="translate(400, 440) scale(2.35)">
    <!-- 1. BARE TAN FEET (Back View: Wide Grounded Stance, Heels & Achilles Tendon) -->
    <!-- Left Heel (Viewer's Left) -->
    <g transform="translate(-28, 68)">
      <path d="M2,4 L24,4 C27,4 28,9 28,15 L28,19 L0,19 L0,14 C0,8 1,4 2,4 Z"
            fill="#b87349" stroke="#1e1e2c" stroke-width="3.2" stroke-linejoin="round"/>
      <line x1="14" y1="4" x2="14" y2="13" stroke="#7a4222" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="8" y1="19" x2="20" y2="19" stroke="#7a4222" stroke-width="1.8"/>
    </g>
    <!-- Right Heel (Viewer's Right) -->
    <g transform="translate(6, 68)">
      <path d="M24,4 L2,4 C-1,4 0,9 0,15 L0,19 L28,19 L28,14 C28,8 27,4 24,4 Z"
            fill="#b87349" stroke="#1e1e2c" stroke-width="3.2" stroke-linejoin="round"/>
      <line x1="14" y1="4" x2="14" y2="13" stroke="#7a4222" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="8" y1="19" x2="20" y2="19" stroke="#7a4222" stroke-width="1.8"/>
    </g>

    <!-- 2. MAROON TROUSERS (Wide Heroic A-Frame, Rear Center Seam, Muscular Calves) -->
    <path d="M-30,38 L30,38 L28,70 L8,70 L4,54 L-4,54 L-8,70 L-28,70 Z"
          fill="#7a2828" stroke="#1e1e2c" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Rear Center Inseam -->
    <line x1="0" y1="38" x2="0" y2="54" stroke="#1e1e2c" stroke-width="2.4"/>
    <!-- Rear Leg Creases & Calf Shadows -->
    <path d="M-22,42 C-26,52 -24,62 -20,70" stroke="#5e1d1d" stroke-width="2.4" fill="none"/>
    <path d="M22,42 C26,52 24,62 20,70" stroke="#5e1d1d" stroke-width="2.4" fill="none"/>

    <!-- 3. RECURVE BOW IN LEFT HAND (Viewer's Left, Proudly Arched Alongside Body) -->
    <g transform="translate(-56, -52) scale(0.76)">
      <!-- Bowstring -->
      <line x1="26" y1="8" x2="26" y2="160" stroke="#ced4da" stroke-width="2.4"/>
      <!-- Wooden Limbs Arching Outward to the Left -->
      <path d="M26,8 C6,28 2,56 10,84 C2,112 6,140 26,160 C14,142 10,114 18,84 C10,54 14,26 26,8 Z"
            fill="#a0522d" stroke="#1e1e2c" stroke-width="3.8" stroke-linejoin="round"/>
      <!-- Blue Wrapped Center Grip -->
      <rect x="8" y="70" width="16" height="28" rx="2" fill="#1e90ff" stroke="#1e1e2c" stroke-width="2.8"/>
      <line x1="8" y1="78" x2="24" y2="78" stroke="#1060c0" stroke-width="1.8"/>
      <line x1="8" y1="86" x2="24" y2="86" stroke="#1060c0" stroke-width="1.8"/>
      <!-- Upper Talon Tip -->
      <path d="M20,8 L30,-4 L34,6 L40,0 L36,12 Z" fill="#f8f9fa" stroke="#1e1e2c" stroke-width="2.4" stroke-linejoin="round"/>
      <!-- Lower Talon Tip -->
      <path d="M20,160 L30,172 L34,162 L40,168 L36,156 Z" fill="#f8f9fa" stroke="#1e1e2c" stroke-width="2.4" stroke-linejoin="round"/>
    </g>

    <!-- 4. TORSO: BROAD MUSCULAR BACK & SLEEVELESS EMERALD VEST -->
    <!-- Muscular Caramel Bare Shoulders & Back Base -->
    <path d="M-40,-14 C-44,6 -40,24 -32,38 L32,38 C40,24 44,6 40,-14 C34,-24 18,-28 0,-28 C-18,-28 -34,-24 -40,-14 Z"
          fill="#b87349" stroke="#1e1e2c" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Deltoid Muscle Curves on Bare Shoulders -->
    <path d="M-38,-8 C-34,6 -34,20 -30,30" stroke="#8f4f2a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M38,-8 C34,6 34,20 30,30" stroke="#8f4f2a" stroke-width="2.2" fill="none" stroke-linecap="round"/>

    <!-- Sleeveless Emerald Green Vest (Fitted back with armholes) -->
    <path d="M-28,-16 C-26,-4 -28,14 -24,38 L24,38 C28,14 26,-4 28,-16 C20,-20 10,-22 0,-22 C-10,-22 -20,-20 -28,-16 Z"
          fill="#06d6a0" stroke="#1e1e2c" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Vest Center Seam & Cel Shading -->
    <line x1="0" y1="-20" x2="0" y2="38" stroke="#05a87d" stroke-width="2.4"/>
    <path d="M-26,-14 C-24,6 -26,24 -22,38 L-16,38 C-20,24 -18,6 -20,-14 Z" fill="#05a87d" opacity="0.6"/>

    <!-- Maroon Waistband Sash -->
    <rect x="-30" y="38" width="60" height="12" rx="2" fill="#7a2828" stroke="#1e1e2c" stroke-width="3.2"/>
    <line x1="-30" y1="44" x2="30" y2="44" stroke="#1e1e2c" stroke-width="2.0"/>

    <!-- 5. LEFT ARM (Holding Recurve Bow at Left, matching Reference Image 2) -->
    <g transform="translate(-36, -18)">
      <!-- Muscular Bicep & Forearm Reaching Out to Bow -->
      <path d="M8,2 C-2,4 -10,12 -12,22 C-12,32 -6,38 2,38 C10,38 14,30 16,20 C16,8 12,2 8,2 Z"
            fill="#b87349" stroke="#1e1e2c" stroke-width="3.2" stroke-linejoin="round"/>
      <path d="M-10,22 L-16,14 L-8,8 L-2,18 Z" fill="#b87349" stroke="#1e1e2c" stroke-width="2.6" stroke-linejoin="round"/>

      <!-- Hand with White Archer Talon Glove Gripping Bow Handle -->
      <g transform="translate(-16, 8)">
        <circle cx="4" cy="6" r="8.5" fill="#f8f9fa" stroke="#1e1e2c" stroke-width="2.6"/>
        <circle cx="4" cy="6" r="3.5" fill="#1e1e2c" opacity="0.15"/>
        <polygon points="10,2 14,6 10,8" fill="#1e1e2c"/>
        <polygon points="8,10 12,13 7,14" fill="#1e1e2c"/>
      </g>
    </g>

    <!-- 6. RIGHT ARM WITH ARCHER TALON BRACER (Viewer's Right, Relaxed at Side) -->
    <g transform="translate(32, -18)">
      <!-- Muscular Upper Arm & Forearm from Behind -->
      <path d="M2,2 C12,2 18,10 18,22 C18,34 12,44 4,46 C-2,46 -6,38 -6,28 C-6,14 -2,2 2,2 Z"
            fill="#b87349" stroke="#1e1e2c" stroke-width="3.2" stroke-linejoin="round"/>
      <path d="M14,14 C12,6 8,2 2,2" stroke="#8f4f2a" stroke-width="2.0" fill="none" stroke-linecap="round"/>

      <!-- White Talon Bracer on Forearm & Hand -->
      <path d="M-2,26 L16,26 L14,44 L-4,42 Z" fill="#f8f9fa" stroke="#1e1e2c" stroke-width="2.8" stroke-linejoin="round"/>
      <circle cx="6" cy="34" r="3.5" fill="#00b4d8" stroke="#1e1e2c" stroke-width="1.6"/>
      <!-- Relaxed Bare Hand with Knuckles -->
      <circle cx="4" cy="48" r="8" fill="#b87349" stroke="#1e1e2c" stroke-width="2.6"/>
      <line x1="1" y1="52" x2="1" y2="46" stroke="#7a4222" stroke-width="1.8"/>
      <line x1="5" y1="53" x2="5" y2="46" stroke="#7a4222" stroke-width="1.8"/>
      <line x1="9" y1="51" x2="9" y2="46" stroke="#7a4222" stroke-width="1.8"/>
    </g>

    <!-- 7. DIAGONAL BACK QUIVER (Clearly Visible at Upper Right Shoulder, matching Ref 2) -->
    <g transform="translate(24, -8) rotate(24)">
      <!-- Leather Quiver Harness Strap Across Back -->
      <line x1="-58" y1="0" x2="20" y2="0" stroke="#4a2e1b" stroke-width="5.0" stroke-linecap="round"/>
      <line x1="-58" y1="0" x2="20" y2="0" stroke="#1e1e2c" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 3"/>

      <!-- Cyan Arrows Fan (4 Fletched Arrows Rising High Above Right Shoulder) -->
      <g transform="translate(0, -22)">
        <path d="M-8,-20 L-3,-46 L1,-20 Z" fill="#00b4d8" stroke="#1e1e2c" stroke-width="2.0" stroke-linejoin="round"/>
        <line x1="-3" y1="-46" x2="-3" y2="-20" stroke="#1e1e2c" stroke-width="1.4"/>

        <path d="M-1,-22 L5,-52 L10,-22 Z" fill="#48cae4" stroke="#1e1e2c" stroke-width="2.0" stroke-linejoin="round"/>
        <line x1="5" y1="-52" x2="5" y2="-22" stroke="#1e1e2c" stroke-width="1.4"/>

        <path d="M7,-20 L13,-44 L17,-20 Z" fill="#00b4d8" stroke="#1e1e2c" stroke-width="2.0" stroke-linejoin="round"/>
        <line x1="13" y1="-44" x2="13" y2="-20" stroke="#1e1e2c" stroke-width="1.4"/>

        <path d="M14,-18 L19,-38 L23,-18 Z" fill="#48cae4" stroke="#1e1e2c" stroke-width="2.0" stroke-linejoin="round"/>
        <line x1="19" y1="-38" x2="19" y2="-18" stroke="#1e1e2c" stroke-width="1.4"/>
      </g>

      <!-- White Quiver Collar with Teardrop Emblem -->
      <rect x="-6" y="-22" width="28" height="16" rx="3" fill="#f8f9fa" stroke="#1e1e2c" stroke-width="3.2"/>
      <path d="M8,-18 C5,-18 4,-14 8,-10 C12,-14 11,-18 8,-18 Z" fill="#1f3160"/>

      <!-- Yellow Eagle Head / Beak Attached to Quiver (Pointing Left as in Ref 2) -->
      <g transform="translate(-16, -14)">
        <path d="M8,-2 C-2,0 -6,8 0,14 C6,20 12,16 14,10 Z" fill="#ffd166" stroke="#1e1e2c" stroke-width="2.6" stroke-linejoin="round"/>
        <path d="M0,14 C-6,18 -12,16 -14,10 C-10,8 -4,6 0,14 Z" fill="#ffb703" stroke="#1e1e2c" stroke-width="2.2" stroke-linejoin="round"/>
        <circle cx="4" cy="6" r="1.8" fill="#1e1e2c"/>
      </g>

      <!-- Navy Quiver Main Cylinder Body (Slender 18 units wide) -->
      <path d="M-4,-6 L20,-6 L16,64 L-2,64 Z" fill="#252b3e" stroke="#1e1e2c" stroke-width="3.5" stroke-linejoin="round"/>
      <line x1="4" y1="-6" x2="2" y2="64" stroke="#181d2a" stroke-width="3.0"/>

      <!-- Quiver Base Cap -->
      <path d="M-2,64 L16,64 L14,72 L0,72 Z" fill="#151928" stroke="#1e1e2c" stroke-width="2.8" stroke-linejoin="round"/>
    </g>

    <!-- 8. DARK NAVY HAIR AT BASE OF SKULL (Chunky Rounded Silhouette Resting on Back) -->
    <g transform="translate(0, -36)">
      <!-- Full Smooth Dark Navy Hair Base -->
      <path d="M-40,-2 C-46,14 -36,28 0,28 C36,28 46,14 40,-2 C32,16 20,22 0,22 C-20,22 -32,16 -40,-2 Z"
            fill="#1f2438" stroke="#1e1e2c" stroke-width="3.5" stroke-linejoin="round"/>
      <!-- Soft Rounded Hair Locks Framing Back -->
      <path d="M-34,2 C-38,16 -24,24 -16,18 C-8,24 8,24 16,18 C24,24 38,16 34,2"
            fill="#1f2438" stroke="#1e1e2c" stroke-width="2.6" stroke-linejoin="round"/>
    </g>

    <!-- 9. WHITE EAGLE COWL (Back View with Profile Beak Peeking Left as in Ref 2) -->
    <g transform="translate(0, -68)">
      <!-- ORANGE FEATHER CREST (Projecting Dynamically Up & Back from Crown) -->
      <g transform="translate(14, -38)">
        <path d="M-2,8 C4,-12 14,-16 22,-6 C20,2 12,4 8,8 C18,10 20,22 12,26 C6,26 0,18 -2,8 Z"
              fill="#ff7b00" stroke="#1e1e2c" stroke-width="3.2" stroke-linejoin="round"/>
        <path d="M-8,10 C-4,-6 4,-8 10,-2 C8,4 2,6 0,10 C8,12 8,22 2,24 C-2,24 -6,18 -8,10 Z"
              fill="#ff9500" stroke="#1e1e2c" stroke-width="2.6" stroke-linejoin="round"/>
      </g>

      <!-- Hooked Yellow Eagle Beak Peeking on Left Edge (Matching Ref 2 stance) -->
      <g transform="translate(-40, 2)">
        <path d="M10,-6 C2,-4 -6,6 -12,16 C-16,26 -12,36 -4,42 C-4,32 2,24 8,18 Z"
              fill="#ffd166" stroke="#1e1e2c" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M-12,16 C-8,26 -4,32 -4,42 C-8,36 -10,28 -12,16 Z" fill="#ffb703"/>
      </g>

      <!-- Fierce Eagle Brow Curve Visible on Left Edge -->
      <path d="M-34,-4 C-40,4 -42,14 -36,22" stroke="#1e1e2c" stroke-width="3.5" stroke-linecap="round" fill="none"/>

      <!-- Main White Eagle Cowl Dome (Clean Helmet Curvature: 88 wide, 78 tall) -->
      <path d="M0,-42 C-34,-42 -44,-16 -44,14 C-44,38 -28,46 0,46 C28,46 44,38 44,14 C44,-16 34,-42 0,-42 Z"
            fill="#f8f9fa" stroke="#1e1e2c" stroke-width="3.8" stroke-linejoin="round"/>

      <!-- Soft Cool Grey Cel Shadow on Lower Cowl Rim -->
      <path d="M-38,18 C-28,40 -16,44 0,44 C16,44 28,40 38,18 C30,34 16,38 0,38 C-16,38 -30,34 -38,18 Z"
            fill="#dce1e6"/>

      <!-- Rear Center Cowl Seam -->
      <line x1="0" y1="-40" x2="0" y2="40" stroke="#dce1e6" stroke-width="2.6"/>
    </g>
  </g>
</svg>
